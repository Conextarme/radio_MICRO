name: Comprobar streams de emisoras

on:
  schedule:
    # Todos los lunes a las 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch: {}

jobs:
  check-streams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Comprobar URLs de streaming
        run: node scripts/check-streams.mjs
