---
name: Comprobar streams de emisoras

on:
  schedule:
    # Todos los lunes a las 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch: {}

# contents: guardar el historial de fallos. issues: avisar de las emisoras caídas.
permissions:
  contents: write
  issues: write

jobs:
  check-streams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Comprobar URLs de streaming
        run: node scripts/check-streams.mjs
        env:
          FAILURE_REPORT_PATH: ${{ runner.temp }}/stream-failures.md
      # Se ejecuta siempre (también si la comprobación falla) para no perder
      # el registro justo de las semanas en que hay emisoras caídas.
      - name: Guardar historial de fallos
        if: always()
        run: |
          if [ -n "$(git status --porcelain stream-health.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stream-health.json
            git commit -m "actualizar historial de fallos de streams"
            git push
          fi
      # El email automático de GitHub no se puede personalizar. El issue sí: al
      # abrirlo, GitHub envía por email su texto con la lista de emisoras.
      - name: Avisar de las emisoras caídas
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/stream-failures.md
        run: |
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            gh issue create --title "Emisoras caídas ($(date +%F))" --body-file "$REPORT"
          fi
